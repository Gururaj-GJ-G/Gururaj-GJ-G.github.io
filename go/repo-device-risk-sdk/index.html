<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting to Android Device Risk SDK</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4EYFGTJDF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    var TARGET = "https://github.com/Gururaj-GJ-G/android-device-risk-sdk";
    var done = false;

    function go() {
      if (done) return;
      done = true;
      window.location.replace(TARGET);
    }

    gtag('config', 'G-4EYFGTJDF', { send_page_view: false });
    gtag('event', 'page_view', {
      page_title: 'Repo click: Android Device Risk SDK',
      page_location: window.location.href,
      page_path: '/go/repo-device-risk-sdk/',
      event_callback: go
    });

    // Fallback: still forward the visitor if the tag is blocked or slow to load.
    setTimeout(go, 1200);
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://github.com/Gururaj-GJ-G/android-device-risk-sdk"></noscript>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
           min-height: 100vh; display: grid; place-items: center;
           background: #0f1115; color: #d8dee9; }
    p { font-size: 15px; }
    a { color: #7fb3d5; }
  </style>
</head>
<body>
  <p>Taking you to <a href="https://github.com/Gururaj-GJ-G/android-device-risk-sdk">Android Device Risk SDK</a> on GitHub&hellip;</p>
</body>
</html>
